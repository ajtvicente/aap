---
- name: mount point linux
  hosts: all
  become: true
  tasks:
    - name: Mount -a
      ansible.builtin.command: mount -a
    - name: Access mount point /file and cat the readm file
      ansible.builtin.command: cat /opt/test
        var: resultado_cat.stdout
    - name: Create a file in /file with the name of the linux server
      ansible.builtin.copy:
        content: "{{ ansible_hostname }}"
        dest: /opt/{{ ansible_hostname }}


