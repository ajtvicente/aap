---
- name: Teste de requisito para execução de setup Red Hat Ansible 
  hosts: all
  become: true
  tasks:
    - name: Hostname
      ansible.builtin.command: cat /etc/hostname
      register: result_cat_hostname

    - name: OS-Release
      ansible.builtin.command: cat /etc/redhat-release
      register: result_cat_release

    - name: uptime
      ansible.builtin.command: uptime
      register: result_cat_uptime

    - name: CPU
      ansible.builtin.command: nproc
      register: result_cat_cpu

    - name: Memory
      ansible.builtin.command: cat /proc/meminfo | grep MemTotal | awk '{print $2/1024/1024 " GB"}'
      register: result_cat_memory

    - name: Firewall
      ansible.builtin.command: firewall-cmd --state
      register: result_cat_firewall

    - name: FSTAB
      ansible.builtin.command: cat /etc/fstab | grep noexec
      register: result_cat_fstab

    - name: NTP
      ansible.builtin.command: cat /etc/chrony.conf | grep -E "^(server|pool)"
      register: result_cat_ntp

    - name: Crypto-Policies
      ansible.builtin.command: update-crypto-policies --show
      register: result_cat_crypto

    - name: Crypto-Policies
      ansible.builtin.command: update-crypto-policies --show
      register: result_cat_crypto

    - name: Python_Version
      ansible.builtin.command: alternatives --list | grep python3
      register: result_cat_python

    - name: SSH 
      ansible.builtin.command: cat /etc/ssh/sshd_config | grep PermitRootLogin
      register: result_cat_ssh

    - name: SELinux
      ansible.builtin.command: sestatus
      register: result_cat_sestatus

    - name: Result
      debug:
        var: result_cat_hostname.stdout, result_cat_release.stdout, result_cat_uptime.stdout, result_cat_cpu.stdout, result_cat_memory.stdout, result_cat_firewall.stdout, result_cat_fstab.stdout, result_cat_ntp.stdout, result_cat_crypto.stdout, result_cat_crypto.stdout, result_cat_python.stdout, result_cat_ssh.stdout, result_cat_sestatus.stdout

