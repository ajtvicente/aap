---
- name: Teste de requisito para execução de setup Red Hat Ansible 
  hosts: localhost
  become: true
  tasks:
    - name: Print hostname
      ansible.builtin.debug:
        var: ansible_hostname
    - name: Print OS release and version
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
    - name: uptime
      ansible.builtin.debug:
        var: ansible_uptime_seconds
    - name: number of cpu
      ansible.builtin.debug:
        var: ansible_processor_count
    - name: List memory in linux
      ansible.builtin.shell: cat /proc/meminfo | grep MemTotal | awk '{print $2/1024/1024 " GB."}'
      register: memory
    - name: output command result
      ansible.builtin.debug:
        msg: "{{ memory.stdout }}"
    - name: Print hostname
      ansible.builtin.debug:
        var: ansible_hostname
    - name: Print OS release and version
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
    - name: uptime
      ansible.builtin.debug:
        var: ansible_uptime_seconds
    - name: number of cpu
      ansible.builtin.debug:
        var: ansible_processor_count
    - name: List memory in linux
      ansible.builtin.shell: cat /proc/meminfo | grep MemTotal | awk '{print $2/1024/1024 " GB."}'
      register: memory
    - name: output command result
      ansible.builtin.debug:
        msg: "{{ memory.stdout }}"
    - name: Print hostname
      ansible.builtin.debug:
        var: ansible_hostname
