---
- name: Demonstrates submitting JCL.
  hosts: zos_host
  gather_facts: false
  vars:
    tgt_tmp_dir: "/tmp"
    job_name: "{{ jcl | default('HELLO') }}"
  environment: "{{ environment_vars }}"
  tasks:

	- name: Execute TSO command List User (LU) for TESTUSER to obtain TSO information.
	  zos_tso_command:
	    commands:
	      - LU TSB0ANS
